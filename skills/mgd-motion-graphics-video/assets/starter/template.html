<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width={{width}}, height={{height}}"><title>MGD Motion Demo</title><link rel="stylesheet" href="styles.css"><script src="assets/gsap.min.js"></script><script src="runtime-config.js"></script></head><body>
<main id="main" {{composition_id}} data-width="{{width}}" data-height="{{height}}" data-duration="{{duration}}" data-fps="{{fps}}">
<div id="world"><div id="sky"></div><div id="halo"></div>
<svg id="mountains-far" viewBox="0 0 1200 1400" preserveAspectRatio="none" aria-hidden="true"><path d="M-100 1200L160 520 300 720 600 240 830 710 1000 430 1350 1200V1500H-100Z" fill="#283d53"/><path d="M492 410L600 240 710 450 600 390Z" fill="#71828c" opacity=".6"/></svg>
<svg id="mountains-near" viewBox="0 0 1200 1400" preserveAspectRatio="none" aria-hidden="true"><path d="M-100 1300L180 750 430 1040 820 620 1300 1300V1500H-100Z" fill="#101d2c"/></svg><div id="mist"></div></div>
<div id="particles" aria-hidden="true"></div>
<section id="intro" class="card"><p class="eyebrow">MOTION GRAPHICS</p><h1>{{headline}}</h1><div class="rule"></div></section>
<section id="middle" class="card"><p class="eyebrow">GESCHICHTEN IN BEWEGUNG</p><h2>{{message}}</h2></section>
<section id="final" class="card"><p class="eyebrow">RAUM FÜR DEINE MARKE</p><h2>{{brand}}</h2><div class="rule"></div><p id="tagline">{{tagline}}</p></section><div id="vignette" aria-hidden="true"></div></main>
<script>window.__timelines = {main: gsap.timeline({paused:true})};</script><script src="particles.js"></script><script src="motion.js"></script></body></html>
